# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 설정 파일 - Frontend (React/TypeScript) Project

# 1. 언어 설정
language: "ko-KR"

# 2. AI에게 주는 지침 (전체적인 톤앤매너)
tone_instructions: |
  당신은 시니어 프론트엔드 개발자입니다. 아래 규칙에 따라 리뷰하세요.

  **기본 규칙**
  - 모든 리뷰 코멘트는 정중하고 부드러운 한국어(해요체 등)로 작성해 주세요.
  - 사소한 띄어쓰기나 포맷팅(Prettier가 해결할 문제)보다는 잠재적 버그, 아키텍처, 로직 개선에 집중해 주세요.
  - 수정이 필요한 경우, 구체적인 TypeScript/React 코드 예시를 포함해서 설명해 주세요.

# 3. 리뷰 동작 설정
reviews:
  # 리뷰 스타일: "chill"(여유로움) vs "assertive"(엄격함)
  profile: "chill"

  # PR 요약 기능 켜기 (High-level Summary)
  high_level_summary: true

  # PR 요약 시 프론트엔드 관점에서 정리하도록 지침 추가
  high_level_summary_instructions: |
    변경 사항을 반드시 '한국어'로 요약해 주세요.
    UI 변경 사항(컴포넌트, 스타일)과 로직 변경 사항(Hooks, 상태 관리, API 호출)을 명확히 구분해서 불렛포인트로 작성해 주세요.

  # 재미 요소: 리뷰 끝에 짧은 시나 농담을 추가할지 여부
  poem: false

  # 변경된 각 파일에 대한 개별 요약을 생성할지 여부 (PR이 너무 길어지는 것을 방지하기 위해 false)
  changed_files_summary: false

  # 시퀀스 다이어그램 생성 여부
  sequence_diagrams: false

  # PR에 연결된 이슈 분석 및 연관 링크 설정
  assess_linked_issues: true
  related_issues: false
  related_prs: true

  # 레이블 및 리뷰어 자동 적용 설정 (필요 시 true로 변경)
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  # 자동 리뷰 통합 설정
  auto_review:
    enabled: true
    drafts: false # Draft PR은 리뷰하지 않음
    auto_incremental_review: true # 추가 커밋 발생 시 변경분만 리뷰

  # 경로별 맞춤 지침 (프론트엔드 폴더 구조 기준)
  path_instructions:
    # 1. 컴포넌트 및 UI 레이어 설정
    - path: "src/components/**"
      instructions: |
        1. @Composable 대신 React 컴포넌트 관점에서 다음 사항을 확인하세요:
        - 불필요한 리렌더링(Re-render)이 발생할 가능성이 있는지 확인해 주세요.
        - useMemo, useCallback 등을 통한 메모이제이션 기회가 있는지 검토해 주세요.
        - 컴포넌트의 책임이 너무 크지 않은지, 더 작은 단위로 분리할 수 있는지 봐주세요.
        2. 공통 스타일 및 테마 규칙:
        - 하드코딩된 스타일 값(Color, Font size 등)이 있다면 프로젝트의 공통 테마 오브젝트(Theme)나 디자인 시스템 토큰을 사용하도록 안내해 주세요.
        - 배포 시점에 불필요한 `console.log`가 남아있으면 경고해 주세요. (단, 주석으로 '필요'라고 적힌 디버깅 코드는 제외)

    # 2. 커스텀 훅 및 상태 관리 레이어 설정
    - path: "src/hooks/**"
      instructions: |
        1. Custom Hooks 검토 시 다음 사항을 확인하세요:
        - 비즈니스 로직과 UI 관심사가 명확히 분리되어 있는지 확인해 주세요.
        - useEffect 사용 시 클린업(Cleanup) 함수가 필요한 상황인데 누락되지 않았는지(메모리 누수 방지) 체크해 주세요.
        - 의존성 배열(Dependency Array)이 정확하게 채워져 있는지 엄격하게 검사해 주세요.

    # 3. API 및 데이터 레이어 설정 (Axios, API 서비스 등)
    - path: "src/api/**"
      instructions: |
        1. 서버 API 호출 코드 검토 시 다음 사항을 확인하세요:
        - TypeScript 인터페이스/타입을 통한 타입 안전성이 확보되었는지 확인해 주세요.
        - 공통 Axios 인터셉터(Interceptor)나 에러 핸들러가 정의된 규칙대로 적절히 처리되고 있는지 봐주세요.
        - 에러 발생 시 공통 에러 객체나 Result 타입 형태로 안전하게 반환되는지 확인해 주세요.

# 4. 채팅 설정 (AI와 대화)
chat:
  auto_reply: true

# 5. CodeRabbit의 지식 기반(Knowledge Base) 설정
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

# 6. 기타 설정
early_access: true
enable_free_tier: true
